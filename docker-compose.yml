services:
  postgres:
    image: postgres:16-alpine
    container_name: trading-journal-db
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: trading
      POSTGRES_PASSWORD: trading
      POSTGRES_DB: trading_journal
    volumes:
      - trading_journal_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trading -d trading_journal"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  trading_journal_pg:
